name: Release

# Manual-trigger only (mirrors the sibling Gatherlight release model). Cutting a release is a deliberate
# act you start from the Actions tab (Run workflow) — there is intentionally NO tag-push / release-published
# trigger. The full verify gate (build · test · e2e · leak scan) runs against the exact commit before the
# irreversible NuGet push, and the version bump is committed only AFTER the publish succeeds.
#
# Publishing uses NuGet Trusted Publishing (OIDC) — no stored API key. Setup (once): on nuget.org,
# Account -> Trusted Publishing -> add a policy for the nuget.org user (Jiarong.Gu), repository
# JiarongGu/Lyntai, and workflow file `release.yml` (scoped to the Lyntai.* package glob).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.28.0) — leave empty to bump from the current version'
        required: false
        type: string
      bump:
        description: 'Version bump type (ignored when an explicit version is given)'
        required: false
        type: choice
        default: 'patch'
        options:
          - none
          - patch
          - minor
          - major
      create_tag:
        description: 'Create + push a git tag for this version'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create the GitHub release as a draft (review before publishing)'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # push the version-bump commit + tag, create the release
  id-token: write   # OIDC token for NuGet Trusted Publishing (mints a short-lived key — no stored secret)

jobs:
  publish:
    name: Verify + pack + push to NuGet
    runs-on: ubuntu-latest   # pure managed library; the DPAPI tests self-skip on Linux, Postgres/Docker runs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes + tag diffs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Version source of truth = src/Directory.Build.props (<VersionPrefix>), which the .NET assemblies AND
      # devtools/project.config.mjs both read. An explicit `version` input wins; otherwise `bump` steps the
      # current semver. The bump is WRITTEN to the working tree here (so pack uses it) but the commit is
      # DEFERRED until after the publish succeeds — a failed release must leave no phantom bump commit.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $current = node -e "import('./devtools/project.config.mjs').then(m=>process.stdout.write(String(m.default.version)))"
          Write-Host "current version: $current"

          $final = $current
          if ("${{ inputs.version }}" -ne "") {
            $final = "${{ inputs.version }}"
            Write-Host "explicit version: $final"
          } elseif ("${{ inputs.bump }}" -ne "none") {
            if ($current -match '^(\d+)\.(\d+)\.(\d+)') {
              $maj = [int]$matches[1]; $min = [int]$matches[2]; $pat = [int]$matches[3]
              switch ("${{ inputs.bump }}") {
                "major" { $maj++; $min = 0; $pat = 0 }
                "minor" { $min++; $pat = 0 }
                "patch" { $pat++ }
              }
              $final = "$maj.$min.$pat"
              Write-Host "bumped ${{ inputs.bump }}: $current -> $final"
            } else {
              Write-Host "::error::version '$current' is not X.Y.Z — pass an explicit version input"
              exit 1
            }
          }

          # Normalize to a full 3-part semver so `1.0` becomes `1.0.0` in the tag + bump.
          if ($final -match '^(\d+)(\.(\d+))?(\.(\d+))?([-+].*)?$') {
            $final = "$([int]$matches[1]).$([int]($matches[3] ?? 0)).$([int]($matches[5] ?? 0))" + $matches[6]
            Write-Host "normalized version: $final"
          }

          if ($final -ne $current) {
            $p = "src/Directory.Build.props"
            $c = Get-Content $p -Raw
            $c = $c -replace "(<VersionPrefix>)[^<]*(</VersionPrefix>)", ('${1}' + $final + '${2}')
            Set-Content $p $c -NoNewline -Encoding utf8
            Write-Host "wrote version $final to $p (commit deferred until the gate + publish pass)"
          }

          # Stamp the CHANGELOG's `## Unreleased` heading for this release, exactly as VersionPrefix (above)
          # and the README `## Status` headline (in Pack) are stamped — this was the one release edit still
          # left to a human, and 1.2.0 shipped with its section titled "Unreleased" because of it. The
          # stamper is idempotent (a re-cut of an already-stamped version rewrites nothing) and never
          # invents prose: `## Unreleased` becomes `## X.Y.Z — <date>`, and an author-supplied
          # `## Unreleased — <title>` becomes `## X.Y.Z — <title> (<date>)`.
          node devtools/dev.mjs changelog --fix --version $final
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::changelog stamp failed — CHANGELOG.md unreadable or unwritable"
            exit 1
          }

          # Did the bump and/or the stamp actually rewrite anything? Asking git (rather than tracking a flag
          # per edit) keeps this honest when only one of them moved, and a re-run that rewrites NEITHER must
          # not produce an empty release commit.
          $changed = if (git status --porcelain -- src/Directory.Build.props CHANGELOG.md) { "true" } else { "false" }
          Write-Host "release files rewritten: $changed"

          "changed=$changed" >> $env:GITHUB_OUTPUT
          "version=$final" >> $env:GITHUB_OUTPUT
          "tag=v$final" >> $env:GITHUB_OUTPUT

      # Gate the release on the full devtools loop (build · test · e2e vs the provider-stub · leak scan)
      # against the exact commit — every LLM call goes through the deterministic stub, no real tokens.
      - name: Verify gate
        run: node devtools/dev.mjs verify

      - name: Pack
        run: node devtools/dev.mjs pack

      # Trusted Publishing: exchange the workflow's GitHub OIDC token for a short-lived nuget.org API key
      # (matched against the policy configured on nuget.org for this repo + workflow). No stored secret.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Jiarong.Gu

      # The irreversible step FIRST (before any git bookkeeping) — so a publish failure leaves no bump commit
      # or tag behind. --skip-duplicate makes a re-run safe if a version is already live; each .nupkg's
      # adjacent .snupkg symbol package is pushed automatically.
      - name: Push to NuGet
        run: >
          dotnet nuget push "publish/packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Commit the release bookkeeping ONLY now that the gate + publish succeeded — a failed release burns no
      # version. Three files move in lock-step with a release and are committed together: VersionPrefix (the
      # Determine step), the README `## Status` headline (auto-synced by Pack), and the stamped CHANGELOG
      # heading (the Determine step). `git add` names them explicitly so nothing else the job touched — a
      # publish/ artifact, a scratch file — can ride along into a release commit.
      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        # LYNTAI_RELEASE marks this as THE authorized author of a version bump / CHANGELOG stamp. The
        # pre-commit guard (devtools/scripts/check-version-bump.mjs) blocks those two edits by hand,
        # because the workflow bumps FROM whatever VersionPrefix says — a manual bump silently skips a
        # version. Hooks are a local `core.hooksPath` setting and so aren't installed on a fresh runner;
        # this is set anyway, so the step stays correct if that ever changes.
        env:
          LYNTAI_RELEASE: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/Directory.Build.props README.md CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push

      # Tag AFTER a green gate + a successful publish (+ the bump commit), so tags point at shipped commits.
      - name: Create git tag
        if: inputs.create_tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          # Idempotent so a re-run (re-cutting the same version) doesn't abort on "tag already exists".
          if (git tag -l $tag) {
            Write-Host "tag $tag already exists — leaving it in place (re-run)."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      # The notes are the one piece of release output a consumer actually READS, and until 2026-08-16 they
      # were the only piece nothing could test — ~40 lines of inline pwsh. The categorizer keyed on
      # `^feat(scope)?:` / `^fix(scope)?:`, neither of which matches conventional commits' BREAKING marker,
      # so every `feat(memory)!:` / `fix(core)!:` / `refactor(api)!:` landed under "Other changes" — 29
      # commits of history when measured, and 11 of 11 in the v2.5.0..3.0 range. A major release whose
      # entire story is breaking changes would have published "New features: 1".
      #
      # It now lives in devtools/scripts/release-notes.mjs behind pure functions, tested by
      # `node devtools/dev.mjs test-devtools` (FIRST in verify, which the gate above already ran). The
      # previous-tag selection moved with it for the same reason. Breaking leads the body when present.
      - name: Generate release notes
        id: notes
        run: |
          node devtools/scripts/release-notes.mjs --tag "${{ steps.version.outputs.tag }}" > release-notes.md
          cat release-notes.md

      # The Release carries only the notes — NOT the .nupkg/.snupkg files. nuget.org is the canonical,
      # permanent home for every published version, so attaching the packages here just duplicates them
      # into GitHub Release-asset storage. The notes link to NuGet for the install.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lyntai ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
